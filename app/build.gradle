plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taewon.mygallag' // namespace가 보통 맨 위에 있거나 compileSdk 근처에 있습니다.
    compileSdk 34 // ◀◀◀ 32에서 34로 변경 (필수)

    defaultConfig {
        applicationId "com.taewon.mygallag"
        minSdk 21
        targetSdk 34 // ◀◀◀ 30에서 34로 변경 (권장)
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1' // 1.3.1 -> 1.6.1 (버전이 너무 낮으면 충돌할 수 있어 올리는 게 좋습니다)
    implementation 'com.google.android.material:material:1.11.0' // 1.4.0 -> 1.11.0
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // 2.1.0 -> 2.1.4

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}